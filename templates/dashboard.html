<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pain Detector MVP</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9fafb;
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
      }

      .card {
        background: white;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        cursor: pointer;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .badge {
        background: #e0e7ff;
        color: #1e3a8a;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
      }

      .score {
        font-size: 13px;
        font-weight: bold;
        margin-right: 10px;
      }

      .copy-btn {
        padding: 5px 10px;
        font-size: 12px;
        border: none;
        border-radius: 5px;
        background: #4f46e5;
        color: white;
        cursor: pointer;
      }

      .copy-btn:hover {
        background: #4338ca;
      }

      .card-body {
        margin-top: 12px;
        display: none;
        font-size: 14px;
        color: #111827;
        line-height: 1.6;
      }

      .card.open .card-body {
        display: block;
      }

      /* Markdown styling */
      .card-body pre {
        background: #111827;
        color: #e5e7eb;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 13px;
      }

      .card-body code {
        background: #f3f4f6;
        color: #1f2937;
        padding: 2px 5px;
        border-radius: 4px;
        font-size: 13px;
      }

      .card-body pre code {
        background: transparent;
        color: inherit;
        padding: 0;
      }

      .card-body blockquote {
        border-left: 4px solid #6366f1;
        background: #eef2ff;
        padding: 10px 14px;
        margin: 10px 0;
        color: #1e3a8a;
      }

      .card-body ul,
      .card-body ol {
        padding-left: 20px;
      }

      .card-body a {
        color: #2563eb;
        text-decoration: underline;
      }

      .card-body h2,
      .card-body h3 {
        margin-top: 14px;
      }
    </style>
  </head>

  <body>
    <h1>Pain Detector – Results</h1>

    {% for r in results %}
    <div class="card">
      <div class="card-header">
        <div class="badges">
          {% for c in r.pain_categories %}
          <span class="badge">{{ c }}</span>
          {% endfor %}
        </div>

        <div>
          <span class="score">Score: {{ r.score }}</span>
          <button
            class="copy-btn"
            data-text="{{ r.text | e }}"
            data-score="{{ r.score }}"
            data-categories="{{ r.pain_categories | tojson }}"
          >
            Copy
          </button>
        </div>
      </div>

      <div class="card-body" data-md="{{ r.text | e }}"></div>
    </div>
    {% endfor %}

    <script>
      document.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("click", () => {
          const body = card.querySelector(".card-body");

          if (!card.classList.contains("open")) {
            const md = body.dataset.md || "";
            body.innerHTML = marked.parse(md);
          }

          card.classList.toggle("open");
        });
      });

      document.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", (event) => {
          event.stopPropagation();

          const text = btn.dataset.text || "";
          const score = btn.dataset.score || "0";

          let categories = [];
          try {
            categories = JSON.parse(btn.dataset.categories || "[]");
          } catch (e) {
            categories = [];
          }

          const content = `Pain types: ${categories.join(", ")}
Score: ${score}

${text}`;

          navigator.clipboard.writeText(content);

          const original = btn.innerText;
          btn.innerText = "Copied ✓";

          setTimeout(() => {
            btn.innerText = original;
          }, 1500);
        });
      });
    </script>
  </body>
</html>
