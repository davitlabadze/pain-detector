<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pain Detector Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9fafb;
        padding: 20px;
      }
      h1 {
        margin-bottom: 20px;
      }

      .controls {
        margin-bottom: 15px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .controls select,
      .controls input {
        padding: 6px 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      .card {
        background: white;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .card.open {
        background: #f1f5f9;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .badge {
        background: #e0e7ff;
        color: #1e3a8a;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
      }
      .score {
        font-size: 13px;
        font-weight: bold;
        margin-right: 10px;
      }
      .copy-btn {
        padding: 5px 10px;
        font-size: 12px;
        border: none;
        border-radius: 5px;
        background: #4f46e5;
        color: white;
        cursor: pointer;
      }
      .copy-btn:hover {
        background: #4338ca;
      }
      .card-body {
        margin-top: 10px;
        display: none;
        font-size: 14px;
        color: #374151;
        line-height: 1.5;
      }
      .card.open .card-body {
        display: block;
      }

      /* Markdown-like styling */
      .card-body pre {
        background: #111827;
        color: #e5e7eb;
        padding: 10px;
        border-radius: 5px;
        overflow-x: auto;
        font-size: 13px;
      }
      .card-body code {
        background: #f3f4f6;
        color: #1f2937;
        padding: 2px 5px;
        border-radius: 4px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>🧠 Pain Detector Dashboard</h1>

    <div class="controls">
      <label>
        Filter by Pain Type:
        <select id="painFilter">
          <option value="">All</option>
          <option value="Time pain">Time pain</option>
          <option value="Cost pain">Cost pain</option>
          <option value="Data pain">Data pain</option>
          <option value="Risk pain">Risk pain</option>
        </select>
      </label>

      <label>
        Min Score:
        <input
          type="number"
          id="minScore"
          value="1"
          min="1"
          style="width: 60px"
        />
      </label>

      <label>
        Sort by Score:
        <select id="sortOrder">
          <option value="desc">Descending</option>
          <option value="asc">Ascending</option>
        </select>
      </label>
    </div>

    <div id="cardsContainer"></div>

    <script>
      // Sample data (replace with actual fetch)
      const techPains = [
        {
          text: "AWS EC2 instance fails with memory leak and high latency.",
          pain_categories: ["Time pain", "Data pain", "Risk pain"],
          score: 4,
        },
        {
          text: "Kubernetes deployment crashed due to misconfiguration.",
          pain_categories: ["Risk pain"],
          score: 2,
        },
        {
          text: "შეცდომა სერვისში, ვერ მუშაობს აპლიკაცია, შეფერხება მოხდა.",
          pain_categories: ["Risk pain", "Time pain", "Data pain"],
          score: 3,
        },
        {
          text: "Our CI/CD pipeline has multiple bugs and crashes frequently.",
          pain_categories: ["Data pain", "Risk pain"],
          score: 3,
        },
      ];

      const container = document.getElementById("cardsContainer");
      const painFilter = document.getElementById("painFilter");
      const minScore = document.getElementById("minScore");
      const sortOrder = document.getElementById("sortOrder");

      function renderCards() {
        container.innerHTML = "";
        let filtered = [...techPains];

        // Filter by pain type
        const pain = painFilter.value;
        if (pain)
          filtered = filtered.filter((r) => r.pain_categories.includes(pain));

        // Filter by min score
        const min = parseInt(minScore.value) || 1;
        filtered = filtered.filter((r) => r.score >= min);

        // Sort
        filtered.sort((a, b) =>
          sortOrder.value === "asc" ? a.score - b.score : b.score - a.score
        );

        // Render
        filtered.forEach((r) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
          <div class="card-header">
            <div class="badges">${r.pain_categories
              .map((c) => `<span class="badge">${c}</span>`)
              .join("")}</div>
            <div>
              <span class="score">Score: ${r.score}</span>
              <button class="copy-btn">Copy</button>
            </div>
          </div>
          <div class="card-body"><pre>${r.text}</pre></div>
        `;
          container.appendChild(card);

          // Toggle body
          card.querySelector(".card-header").addEventListener("click", () => {
            card.classList.toggle("open");
          });

          // Copy button
          card.querySelector(".copy-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            navigator.clipboard.writeText(r.text);
            const btn = e.target;
            const original = btn.innerText;
            btn.innerText = "Copied ✓";
            setTimeout(() => (btn.innerText = original), 1500);
          });
        });
      }

      // Event listeners
      painFilter.addEventListener("change", renderCards);
      minScore.addEventListener("input", renderCards);
      sortOrder.addEventListener("change", renderCards);

      // Initial render
      renderCards();
    </script>
  </body>
</html>
