<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pain Detector MVP</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f4f5f7;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
      }

      .container {
        max-width: 800px;
        width: 100%;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo {
        width: 100px;
        height: 100px;
        background: #4f46e5;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 15px;
      }

      h1 {
        color: #1f2937;
        margin-bottom: 20px;
        text-align: center;
      }

      .controls {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
        flex-wrap: wrap;
        justify-content: center;
      }

      select {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        background: white;
        font-size: 14px;
      }

      .card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        width: 800px;
        transition: min-height 0.3s ease;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .badge {
        background: #e0e7ff;
        color: #3730a3;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
      }

      .score {
        font-weight: bold;
        font-size: 13px;
        margin-right: 10px;
      }

      .card-actions {
        display: flex;
        gap: 6px;
      }

      .copy-btn,
      .link-btn {
        padding: 5px 8px;
        font-size: 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .copy-btn {
        background: #4f46e5;
        color: white;
      }

      .copy-btn:hover {
        background: #4338ca;
      }

      .link-btn {
        background: #2563eb;
        color: white;
      }

      .link-btn:hover {
        background: #1d4ed8;
      }

      .card-body {
        margin-top: 12px;
        display: none;
        font-size: 14px;
        color: #111827;
        line-height: 1.6;
      }

      .card.open .card-body {
        display: block;
      }

      .card-body pre {
        background: #111827;
        color: #e5e7eb;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 13px;
      }

      .card-body code {
        background: #f3f4f6;
        color: #1f2937;
        padding: 2px 5px;
        border-radius: 4px;
        font-size: 13px;
      }

      .card-body pre code {
        background: transparent;
        color: inherit;
        padding: 0;
      }

      .card-body blockquote {
        border-left: 4px solid #6366f1;
        background: #eef2ff;
        padding: 10px 14px;
        margin: 10px 0;
        color: #1e3a8a;
      }

      .card-body a {
        color: #2563eb;
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="logo">🧠</div>
      <h1>Pain Detector – Results</h1>

      <div class="controls">
        <select id="filter-category">
          <option value="">All Categories</option>
        </select>

        <select id="sort-score">
          <option value="desc">Score: High → Low</option>
          <option value="asc">Score: Low → High</option>
        </select>
      </div>

      <div id="cards-container">
        {% for r in results %}
        <div
          class="card"
          data-score="{{ r.score }}"
          data-categories="{{ r.pain_categories | tojson }}"
        >
          <div class="card-header">
            <div class="badges">
              {% for c in r.pain_categories %}
              <span class="badge">{{ c }}</span>
              {% endfor %}
            </div>

            <div class="card-actions">
              <span class="score">Score: {{ r.score }}</span>
              <button class="copy-btn" data-text="{{ r.text | e }}">
                Copy
              </button>
              <button
                class="link-btn"
                onclick="window.open('{{ r.link }}', '_blank')"
              >
                🔗
              </button>
            </div>
          </div>

          <div class="card-body" data-md="{{ r.text | e }}"></div>
        </div>
        {% endfor %}
      </div>
    </div>

    <script>
      const cards = document.querySelectorAll(".card");

      cards.forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target.tagName === "BUTTON") return;

          const body = card.querySelector(".card-body");
          if (!card.classList.contains("open")) {
            body.innerHTML = marked.parse(body.dataset.md || "");
          }
          card.classList.toggle("open");
        });
      });

      document.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", (event) => {
          event.stopPropagation();
          navigator.clipboard.writeText(btn.dataset.text);
          const original = btn.innerText;
          btn.innerText = "Copied ✓";
          setTimeout(() => {
            btn.innerText = original;
          }, 1500);
        });
      });

      const filterSelect = document.getElementById("filter-category");
      const allCategories = new Set();
      cards.forEach((card) => {
        JSON.parse(card.dataset.categories).forEach((c) =>
          allCategories.add(c)
        );
      });
      allCategories.forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.innerText = c;
        filterSelect.appendChild(opt);
      });

      function renderCards() {
        const container = document.getElementById("cards-container");
        const filterVal = filterSelect.value;
        const sortVal = document.getElementById("sort-score").value;

        const cardArr = Array.from(cards);
        cardArr.forEach((card) => {
          const categories = JSON.parse(card.dataset.categories);
          card.style.display =
            filterVal && !categories.includes(filterVal) ? "none" : "block";
        });

        cardArr.sort((a, b) => {
          const sA = parseFloat(a.dataset.score);
          const sB = parseFloat(b.dataset.score);
          return sortVal === "asc" ? sA - sB : sB - sA;
        });

        cardArr.forEach((c) => container.appendChild(c));
      }

      filterSelect.addEventListener("change", renderCards);
      document
        .getElementById("sort-score")
        .addEventListener("change", renderCards);
    </script>
  </body>
</html>
